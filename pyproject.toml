[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory"
version = "0.1.0"
description = "AI Software Factory - orkiestracja agentów Claude w Camunda 8 (Zeebe)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11,<2",
    "pyzeebe>=4.7,<5",
    "python-dotenv>=1.0",
]

[project.scripts]
ai-factory = "ai_factory.worker:main"

[tool.setuptools.packages.find]
where = ["src"]
